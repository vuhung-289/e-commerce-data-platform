version: 2

models:
  - name: fact_daily_summary
    description: >
      Daily summary table — the core of the entire pipeline.
      One row = one day. Joins transactions + exchange_rate + news.
      Used for Looker Studio dashboard and business reports.

    columns:
      - name: order_date
        description: "Transaction date (PK)"
        tests:
          - unique
          - not_null

      - name: gmv_vnd
        description: "Gross Merchandise Value in VND"
        tests:
          - not_null

      - name: gmv_usd
        description: "GMV converted to USD using Vietcombank rate"

      - name: cancellation_rate_pct
        description: "Order cancellation rate (%)"
        tests:
          - not_null

      - name: has_major_ecommerce_event
        description: "True if the day has >= 3 major e-commerce news articles"